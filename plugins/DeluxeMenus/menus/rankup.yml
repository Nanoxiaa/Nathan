rankup:
  menu_title: "&8RankUp"
  open_command:
    - rankup
  size: 27

  items:
    info:
      material: BOOK
      slot: 4
      display_name: "&6RankUp &7| &fVotre progression"
      lore:
        - "&7Solde: &a$%vault_eco_balance%"
        - "&7Niveau: &b%player_level%"
        - "&7Rang actuel: &e%luckperms_primary_group_name%"

    close:
      material: BARRIER
      slot: 22
      display_name: "&cFermer"
      left_click_commands:
        - "[close]"

    # --------------------
    # RANK B
    # --------------------
    B-CURRENT:
      material: LIME_STAINED_GLASS_PANE
      slot: 10
      priority: 1
      display_name: "&aRang B &7- &aActuel"
      lore:
        - "&7Vous êtes déjà &aB"
      view_requirement:
        requirements:
          is_current:
            type: "string equals ignorecase"
            input: "%luckperms_primary_group_name%"
            output: "b"

    B-AVAILABLE:
      material: GOLD_BLOCK
      slot: 10
      priority: 2
      display_name: "&ePassez au Rang B"
      lore:
        - "&7Conditions:"
        - "  &8- &a$10,000"
        - "  &8- &bNiveau 10"
        - "&7Cliquez pour monter en grade."
      view_requirement:
        requirements:
          from_a:
            type: "string equals ignorecase"
            input: "%luckperms_primary_group_name%"
            output: "a"
      left_click_requirement:
        requirements:
          money:
            type: "greater than or equal to"
            input: "%vault_eco_balance%"
            output: 10000
          level:
            type: "greater than or equal to"
            input: "%player_level%"
            output: 10
        deny_commands:
          - "[message] &cVous n'avez pas les conditions pour &lB&c !"
          - "[sound] ENTITY_VILLAGER_NO 1 1"
      left_click_commands:
        - "[close]"
        - "[console] eco take %player_name% 10000"
        - "[console] lp user %player_name% parent set b"
        - "[sound] UI_TOAST_CHALLENGE_COMPLETE 1 1"
        - "[message] &aFélicitations ! Vous êtes maintenant &lB&a."

    B-LOCKED:
      material: RED_STAINED_GLASS_PANE
      slot: 10
      priority: 99
      display_name: "&cRang B Verrouillé"
      lore:
        - "&7Atteignez d'abord le rang &eA &7pour débloquer."

